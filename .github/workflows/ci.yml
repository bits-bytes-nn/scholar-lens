name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true
      - name: Cache virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-poetry${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies (locked dev tools)
        run: poetry install --no-interaction --with dev
      - name: Ruff (lint)
        run: poetry run ruff check scholar_lens scripts tests
      - name: Black (format check)
        run: poetry run black --check scholar_lens scripts tests
      - name: Mypy (type check)
        run: poetry run mypy scholar_lens scripts

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true
      - name: Cache virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-poetry${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies (with dev group)
        run: poetry install --no-interaction --with dev
      - name: Run pytest with coverage
        run: >-
          poetry run pytest tests/
          -p no:cacheprovider
          -W ignore::DeprecationWarning
          --cov=scholar_lens
          --cov=scripts
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=65
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build Batch image
        run: docker build -f Dockerfile -t scholar-lens-batch:ci .
      - name: Smoke-run the CLI in the image
        run: docker run --rm scholar-lens-batch:ci python3 -m scholar_lens --help
      - name: Import every pipeline in the image (catches a missing runtime dependency)
        run: >-
          docker run --rm scholar-lens-batch:ci python3 -c
          "import scholar_lens.src.paper_pipeline, scholar_lens.src.guide_pipeline, scholar_lens.src.code_retriever"

  cdk-synth:
    name: CDK synth (infra validation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true
      - name: Cache virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-poetry${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --with dev
      - name: Synthesize stack (fake account, no AWS calls)
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: "ap-northeast-2"
          AWS_DEFAULT_REGION: "ap-northeast-2"
        run: poetry run python scripts/ci_synth_check.py

  post-conventions:
    name: Post conventions match the blog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: python -m pip install --quiet requests pyyaml
      - name: Compare with the blog's _data/post_conventions.yml
        # Skips with a notice until BLOG_REPO is set and the blog has the file.
        env:
          BLOG_REPO: ${{ vars.BLOG_REPO }}
          BLOG_BRANCH: ${{ vars.BLOG_BRANCH }}
          GITHUB_TOKEN: ${{ secrets.BLOG_READ_TOKEN }}
        run: python scripts/check_post_conventions.py
