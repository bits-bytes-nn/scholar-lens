name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true
      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies (locked dev tools)
        run: poetry install --no-interaction --with dev
      - name: Ruff (lint)
        run: poetry run ruff check scholar_lens scripts tests
      - name: Black (format check)
        run: poetry run black --check scholar_lens scripts tests
      - name: Mypy (type check)
        run: poetry run mypy scholar_lens scripts

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true
      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies (with dev group)
        run: poetry install --no-interaction --with dev
      - name: Run pytest with coverage
        run: >-
          poetry run pytest tests/
          -p no:cacheprovider
          -W ignore::DeprecationWarning
          --cov=scholar_lens
          --cov=scripts
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Batch image
        # The same official python image (identical index digest) from Google's
        # Docker Hub mirror. Anonymous pulls from public.ecr.aws answer GitHub's
        # shared runner IPs with 429 "Data limit exceeded"; the Batch build in
        # AWS keeps the Dockerfile's ECR Public default.
        run: >-
          docker build -f Dockerfile
          --build-arg PYTHON_IMAGE=mirror.gcr.io/library/python:3.12-slim-bookworm
          -t scholar-lens-batch:ci .
      - name: Smoke-run the CLI in the image
        run: docker run --rm scholar-lens-batch:ci python3 -m scholar_lens --help
      - name: Import PyMuPDF and every pipeline in the image (catches a missing runtime dependency)
        run: >-
          docker run --rm scholar-lens-batch:ci python3 -c
          "import fitz, scholar_lens.src.paper_pipeline, scholar_lens.src.guide_pipeline, scholar_lens.src.survey_pipeline, scholar_lens.src.survey_writer, scholar_lens.src.code_retriever"
      - name: Worker reports a malformed request (JSON, exit 11)
        run: |
          set +e
          docker run --rm scholar-lens-batch:ci python3 -m scholar_lens worker --request '{bad' > out.json
          code=$?
          set -e
          test "$code" -eq 11
          python3 -c "import json; assert json.load(open('out.json'))['status'] == 'rejected'"

  cdk-synth:
    # Required by branch protection on main; the same synth also runs in
    # tests/test_infra_contract.py.
    name: CDK synth (infra validation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true
      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --with dev
      - name: Synthesize stack (fake account, no AWS calls)
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: "ap-northeast-2"
          AWS_DEFAULT_REGION: "ap-northeast-2"
        run: poetry run python scripts/ci_synth_check.py
