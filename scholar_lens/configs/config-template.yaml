# Copy to config.yaml (gitignored) and fill in the resource values. Every key
# below shows the code default; omit a key to keep it, except
# `resources.project_name`, which is required once `resources` is present.
# Unknown keys are errors.
# `cdk deploy` bakes this file into the Batch image: re-run `cdk deploy` after
# editing it, or Batch jobs keep the old values.

resources:
  project_name: scholar-lens
  stage: dev                       # dev | prod
  profile_name:                    # local AWS profile (Batch uses its job role)
  default_region_name: ap-northeast-2
  bedrock_region_name: us-west-2
  s3_bucket_name:                  # existing bucket; required for `cdk deploy` and Batch runs
  s3_prefix: scholar-lens
  vpc_id:
  subnet_ids:
  email_address:                   # SNS notifications (success and failure)
  github:
    enabled: false
    repo_name:                     # owner/owner.github.io
    base_branch: main
    branch_prefix: paper-reviews   # PR branches: <prefix>/review-<id>, summary-<id>, guide-<url-hash>, survey-<topic>
    author_name: Scholar Lens Bot
    author_email:
    # Lead category written to each post's front matter, per artifact type.
    review_category: Paper Reviews
    summary_category: Paper Summaries
    tech_guide_category: Tech Guides
    survey_category: Paper Surveys   # a type the blog's post conventions must list
    # Upload figures to S3 with a public-read ACL (blog images normally come
    # from the blog repository, so keep this off).
    public_assets: false

# Any *_model_id accepts a LanguageModelId value (scholar_lens/src/constants.py),
# e.g. anthropic.claude-fable-5-1 for the highest quality at a higher price.
paper:
  figure_analysis_model_id: anthropic.claude-haiku-5-5
  citation_extraction_model_id: anthropic.claude-sonnet-5-5
  attributes_extraction_model_id: anthropic.claude-haiku-5-5

code:
  code_analysis_model_id: anthropic.claude-haiku-5-5
  code_summarization_model_id: anthropic.claude-haiku-5-5
  embed_model_id: amazon.titan-embed-text-v2:0
  chunk_size: 1024
  chunk_overlap: 256
  # Index at most this many of the repos' most relevant Python files / chunks
  # (vendored libraries, tests and files over 100 KB are skipped).
  max_files: 150
  max_chunks: 400

citations:
  citation_summarization_model_id: anthropic.claude-haiku-5-5
  # Read each cited paper's full text instead of its abstract (slow).
  prefer_full_text: false

explanation:
  # Plans the review from the whole paper and edits the finished article.
  paper_planning_model_id: anthropic.claude-opus-5-5
  paper_finalization_model_id: anthropic.claude-opus-5-5
  paper_evaluation_model_id: anthropic.claude-opus-5-5
  paper_synthesis_model_id: anthropic.claude-opus-5-5
  evaluator_enable_thinking: false
  synthesizer_enable_thinking: false
  # Thinking effort (low|medium|high|xhigh|max) for adaptive-thinking models.
  # The 5.x models always think; effort is their cost/depth control.
  thinking_effort: medium
  planning_effort: high           # effort for planning and the edit pass
  min_quality_score: 70
  max_synthesis_attempts: 3
  max_sections: 20
  max_edit_rounds: 2              # 2nd round for coverage gaps or skipped edits
  # Hard total-token ceiling for one run (null = no limit); a LoRA-length
  # paper uses ~1.4M.
  max_total_tokens: 8000000

summary:
  summary_model_id: anthropic.claude-opus-5-5
  summarizer_enable_thinking: false
  thinking_effort: medium
  max_total_tokens: 1000000        # hard ceiling (null = no limit)

tech_guide:
  relevance_model_id: anthropic.claude-haiku-5-5
  synopsis_model_id: anthropic.claude-sonnet-5-5
  writing_model_id: anthropic.claude-opus-5-5
  evaluation_model_id: anthropic.claude-opus-5-5
  writer_enable_thinking: false
  evaluator_enable_thinking:       # null = same as writer_enable_thinking
  thinking_effort: medium
  # Fact-check each section against the sources (one extra call per section).
  verify_grounding: true
  # Derive web-search queries from the docs and reference material (needs
  # TAVILY_API_KEY or BRAVE_API_KEY) across three intents (usage, internals
  # and design, production integration), and fetch the top result pages into
  # the corpus, taken round-robin across the queries (12 = the top two results
  # of each query). Each section reads at most ~60k characters of its most
  # relevant pages, so more pages mainly grow the one outline call.
  auto_research: true
  max_research_queries: 6
  fetch_top_results: 12
  # At most this many sections (3-30); the outline plans within it.
  max_sections: 14
  min_quality_score: 75
  max_revision_attempts: 1
  # Soft limit: past it, remaining sections skip evaluate/revise/grounding;
  # past 1.5x the run aborts.
  max_total_tokens: 3000000

survey:
  # Plan stage (`survey plan`): scope call, then the selection call.
  scope_model_id: anthropic.claude-sonnet-5-5
  selection_model_id: anthropic.claude-opus-5-5
  thinking_effort: medium
  # The selection call picks a count in [min_papers, max_papers] from the
  # topic's breadth and the pool, out of the candidate_pool best-ranked
  # candidates (max_papers <= candidate_pool).
  min_papers: 6
  max_papers: 25
  candidate_pool: 60
  # Soft limit: past it the repair round is skipped; past 1.5x the run aborts.
  max_total_tokens: 300000
  # Write stage (`survey write --plan`): one card call per paper (cached by
  # paper, card schema, model and language), one outline call, per section a
  # writer, an evaluator, up to max_revision_attempts revisions and a
  # grounding pass, then one finalization call (description, taxonomy).
  card_model_id: anthropic.claude-sonnet-5-5
  outline_model_id: anthropic.claude-opus-5-5
  writing_model_id: anthropic.claude-opus-5-5
  evaluation_model_id: anthropic.claude-opus-5-5
  card_source_chars: 150000        # of a core paper's arXiv HTML text
  min_quality_score: 75
  max_revision_attempts: 1
  verify_grounding: true
  # Length in characters of prose (Korean; other languages x2.5): each paper
  # adds its share to its lineage section, other sections their depth's size,
  # and the total is scaled into [min_total_chars, max_total_chars].
  chars_per_core_paper: 3000
  chars_per_supporting_paper: 800
  min_total_chars: 20000
  max_total_chars: 70000
  # Soft limit on one write run: past it sections skip evaluation, revision
  # and grounding; past 1.5x the run aborts.
  write_max_total_tokens: 3000000

# Language of every generated artifact (e.g. Korean, English).
output_language: Korean
