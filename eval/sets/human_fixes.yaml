# Defects humans fixed (or review checklists flagged) in generated blog posts.
# Each entry is a check a regenerated artifact for the same input must pass.
# Blog repo: bits-bytes-nn/bits-bytes-nn.github.io. `source` is a PR number
# (#N) or a commit sha in that repo.
# status: fixed   = a human changed the published text (evidence: diff)
#         flagged = listed in the PR's review checklist; may be unresolved
version: 1

items:
  review-dpo:
    input: "arXiv 2305.18290"
    kind: review
    post: _posts/2025-10-19-direct-preference-optimization--your-language-model-is-secretly-a-reward-model.md
    sources: ["#86 (7d4251a)", "#88 (40562dc)", "#89 (8298b7b)"]
    notes: >-
      Same-day commit 225347a (2025-10-19) only reformatted headings, tables and
      math escaping and is not listed. Respondent counts and comparison columns
      were wrong in two places (body table and appendix table); one entry each.
    fixes:
      - id: implementation-fragment
        category: markup
        status: fixed
        wrong: 'paragraph reduced to a stray fragment "/\pi_{\text{ref}}$를 초기화합니다."'
        right: "Implementation is two steps: set pi_ref (pi_ref = pi^SFT if preferences were sampled from it, else maximize likelihood of preferred completions (x, y_w)), then minimize the DPO BCE loss on (x, y_w, y_l); no reward model or policy sampling."
        check: 'No line begins with a broken math fragment such as "/\pi"; the implementation section explains how pi_ref is chosen (pi^SFT or MLE on y_w) before the DPO loss step.'
        source: 7d4251a
      - id: beta-tldr
        category: number_scope
        status: fixed
        wrong: '"모든 실험에서 기본 하이퍼파라미터는 β = 0.1"'
        right: "beta = 0.1 by default, but beta = 0.5 for TL;DR summarization."
        check: "If beta is given as a default, the post does not say it applies to all experiments; TL;DR summarization uses beta = 0.5."
        source: 7d4251a
      - id: future-work-ranking-invented
        category: invented_content
        status: fixed
        wrong: '"다중 선택지에 대한 순위나 조건부 선호도 등을 다루는 확장도 가능합니다. 이러한 확장은 ... 정렬 품질을 향상시킬 수 있습니다." (as future work)'
        right: "Paper's future work: OOD generalization, reward over-optimization, scaling past 6B, eliciting high-quality judgments from automated evaluators, applying DPO to generative models in other modalities."
        check: "Future-work list mentions eliciting good judgments from automated evaluators and other modalities; it does not present 'conditional preferences' as a paper-stated direction."
        source: 7d4251a
      - id: plackett-luce-not-future
        category: invented_content
        status: fixed
        wrong: '"DPO의 이론적 프레임워크는 다른 선호도 모델링 접근법으로 확장될 수 있습니다 ... 다중 선택지에 대한 순위나 조건부 선호도 등을 다루는 확장도 가능합니다."'
        right: "The paper already derives the DPO objective under the Plackett-Luce ranking model (Appendix A.3), so ranked feedback is covered without a separate reward model."
        check: "Ranking extensions are described as already derived (Plackett-Luce, Appendix A.3), not as a hypothetical extension."
        source: 7d4251a
      - id: ppo-clip-objective
        category: math
        status: fixed
        wrong: '\min\left(\frac{\pi_\theta(a|s)}{\pi_{\theta_k}(a|s)}, 1 \pm \epsilon\right) A^{\pi_{\theta_k}}(s,a)'
        right: '\min\left(r_\theta A, \operatorname{clip}(r_\theta, 1-\epsilon, 1+\epsilon) A\right) with r_\theta = \pi_\theta(a \mid s)/\pi_{\theta_k}(a \mid s)'
        check: "The PPO objective has min over (ratio*A, clip(ratio, 1-eps, 1+eps)*A); no '1 \\pm \\epsilon' inside min."
        source: 7d4251a
      - id: partition-function-size
        category: math
        status: fixed
        wrong: '"가능한 응답의 수가 어휘 크기의 시퀀스 길이 제곱에 비례하여"'
        right: "The number of responses is |V|^L (vocabulary size to the power of sequence length), exponential in length."
        check: "Partition-function cost is described as |V|^L / exponential in length, not quadratic."
        source: 7d4251a
      - id: cnn-dm-prompt-variant
        category: other
        status: fixed
        wrong: '"Reddit TL;DR에 사용한 것과 동일한 GPT-4 프롬프트를 사용하되"'
        right: "The CNN/DailyMail OOD evaluation uses the GPT-4 (C) prompt."
        check: "CNN/DailyMail win-rate paragraph names the GPT-4 (C) prompt."
        source: 7d4251a
      - id: human-study-columns
        category: wrong_row_or_variant
        status: fixed
        wrong: '"| DPO vs PPO-1 | SFT vs PPO-1 | PPO-1 vs PPO-N |" (body and appendix tables)'
        right: "Columns are DPO vs PPO-0, SFT vs PPO-0, PPO-1 vs PPO-0."
        check: "Human-study table columns compare against PPO-0; no 'PPO-N' column."
        source: 7d4251a
      - id: human-study-respondents
        category: other
        status: fixed
        wrong: '"응답자 수 | 27 | 21 | 22" (body and appendix tables)'
        right: "N respondents: 272, 122, 199."
        check: "Respondent row reads 272 / 122 / 199."
        source: 7d4251a
      - id: multi-judgment-comparisons
        category: misattribution
        status: fixed
        wrong: '"DPO와 PPO-1 비교에 대해서만 여러 인간 판단을 수집합니다"'
        right: "Multiple human judgments were collected only for DPO vs PPO-0 and PPO-1 vs PPO-0."
        check: "Multiple human judgments are attributed to DPO vs PPO-0 and PPO-1 vs PPO-0 (both places)."
        source: 7d4251a
      - id: overoptimization-figure-ref
        category: other
        status: fixed
        wrong: '"앞서 제시한 실험 결과 그림의 오른쪽에서"'
        right: "Paper Figure 3 right (training progress on the dialogue task)."
        check: "The slight late-training drop is tied to the paper's Figure 3 right (dialogue), not a vague 'figure shown earlier'."
        source: 7d4251a
      - id: gradient-u-definition
        category: math
        status: fixed
        wrong: 'u = \hat{r}_\theta(x, y_l) - \hat{r}_\theta(x, y_w)'
        right: 'u = \hat{r}_\theta(x, y_w) - \hat{r}_\theta(x, y_l)'
        check: "In the appendix gradient derivation, u is defined as r_hat(y_w) - r_hat(y_l)."
        source: 7d4251a
      - id: gradient-sigma-argument
        category: math
        status: fixed
        wrong: '\sigma(\hat{r}_\theta(x, y_w) - \hat{r}_\theta(x, y_l)) as the gradient weight (equation and explanation)'
        right: '\sigma(\hat{r}_\theta(x, y_l) - \hat{r}_\theta(x, y_w)), which is near 1 when the implicit reward misorders the pair'
        check: "Every DPO gradient weight is sigma(r_hat(y_l) - r_hat(y_w)), consistent with the 'close to 1 when wrong' explanation."
        source: 7d4251a
      - id: best-of-n-invented
        category: invented_content
        status: fixed
        wrong: '"두 작업 모두에서 Best of 64와 Best of 128의 성능 차이가 미미하여, 추가 샘플링으로 인한 개선이 제한적임을 보여줍니다."'
        right: "Paper only states that performance plateaus after roughly 64-128 samples."
        check: "No added claim about the Best-of-64 vs Best-of-128 gap beyond the plateau statement."
        source: 7d4251a
      - id: excluded-participant
        category: other
        status: fixed
        wrong: '"참가자는 총 25명의 자원봉사 평가자로" (no exclusion noted)'
        right: "One of the 25 participants submitted late and was excluded from the final analysis but is listed."
        check: "If 25 participants are mentioned, the post notes one was excluded from analysis."
        source: 7d4251a
      - id: missing-description
        category: metadata
        status: fixed
        wrong: "front matter had no description:"
        right: "Plain-text description, 120-158 chars, starting with the method name, numbers only from the TL;DR/abstract (e.g. TL;DR GPT-4 win rate ~61% vs PPO 57%)."
        check: "Front matter has a plain-text description that starts with 'DPO' and only uses numbers that appear in the TL;DR or abstract."
        source: "#88 (40562dc)"
      - id: arxiv-https
        category: citation_link
        status: fixed
        wrong: "http://arxiv.org/pdf/2305.18290v3"
        right: "https://arxiv.org/pdf/2305.18290v3"
        check: "All arXiv links use https."
        source: "#89 (8298b7b)"

  review-kimi:
    input: "arXiv 2507.20534"
    kind: review
    post: _posts/2025-10-03-kimi-k2--open-agentic-intelligence.md
    sources: ["#88 (40562dc)", "#89 (8298b7b)", "#119 (92f57ad)"]
    notes: >-
      Most defects lived in a duplicated copy of the RL and RL-infrastructure
      sections that #119 removed. Earlier commits ab5e414 (2025-10-03) and
      534de14 (#83, tag renames) are not listed.
    fixes:
      - id: rl-section-duplicated
        category: structure_duplication
        status: fixed
        wrong: 'the "### 강화학습" section and "### 강화학습 인프라" each appeared twice (one copy with invented content)'
        right: "One RL section following paper sections 3.2-3.3, then one RL infrastructure section."
        check: "Each of '강화학습', '강화학습 인프라', '코로케이션 아키텍처', '검증 가능한 보상' appears once as a heading."
        source: "#119 (92f57ad)"
      - id: rl-subheading-levels
        category: structure_duplication
        status: fixed
        wrong: "RL subsections (검증 가능한 보상, 강화학습 알고리즘, ...) were siblings of '### 강화학습' (H3)"
        right: "Nested under the RL section (H4, and H5 for their sub-parts)."
        check: "Verifiable-reward, self-critique and RL-algorithm headings are nested below the single RL heading."
        source: "#119 (92f57ad)"
      - id: ppo-claim
        category: misattribution
        status: fixed
        wrong: '"PPO(Proximal Policy Optimization) 알고리즘을 기반으로 한 정책 최적화가 이루어집니다"'
        right: "K2 adopts the policy optimization algorithm introduced in K1.5 (paper 3.2.3)."
        check: "The post does not say K2's RL uses PPO; it names the K1.5 policy optimization algorithm."
        source: "#119 (92f57ad)"
      - id: invented-budget-formula
        category: invented_content
        status: fixed
        wrong: 'L_{budget} = \lambda_{budget} \cdot \max(0, |response| - target_{length})'
        right: "Budget control is a per-sample maximum token budget set by task type; responses over budget are truncated and penalized. No formula in the paper."
        check: "No L_budget / lambda_budget formula."
        source: "#119 (92f57ad)"
      - id: invented-ptx-formula
        category: invented_content
        status: fixed
        wrong: 'L_{total} = L_{RL} + \alpha_{PTX} \cdot L_{PTX}; PTX described as replaying original pre-training data'
        right: "PTX is an auxiliary loss on a curated set of hand-selected high-quality samples, integrated into the RL objective; no such formula given."
        check: "No L_total / alpha_PTX formula; PTX data is described as curated high-quality samples, not the pre-training corpus."
        source: "#119 (92f57ad)"
      - id: invented-temperature-formula
        category: invented_content
        status: fixed
        wrong: 'T(t) = T_{init} \cdot \exp(-\gamma \cdot t)'
        right: "Paper describes a temperature decay schedule (explore early, exploit later) without a functional form."
        check: "No exponential temperature formula T(t)."
        source: "#119 (92f57ad)"
      - id: invented-env-code
        category: invented_content
        status: fixed
        wrong: "python code block 'class AgenticEnvironment' with reset/step/render/close"
        right: "Paper describes a unified OpenAI-Gym-like interface; it gives no code."
        check: "No AgenticEnvironment class or other code block presented as the paper's environment API."
        source: "#119 (92f57ad)"
      - id: invented-math-verifier
        category: invented_content
        status: fixed
        wrong: '"하이브리드 규칙 검증 시스템 ... 기호적 동등성 ... 단계별 추론 과정도 평가"'
        right: "For math/STEM/logic the paper describes RL data preparation: diverse coverage and moderate difficulty selected with SFT pass@k."
        check: "Math/STEM verifiable rewards are described via coverage and pass@k-based difficulty, not step-by-step reasoning grading or symbolic-equivalence checkers."
        source: "#119 (92f57ad)"
      - id: invented-logic-verifier
        category: invented_content
        status: fixed
        wrong: '"형식 논리학의 원칙을 바탕으로 추론 체인의 각 단계가 논리적으로 타당한지 확인"'
        right: "No such formal-logic step verifier in the paper."
        check: "No formal-logic chain verifier claim."
        source: "#119 (92f57ad)"
      - id: invented-code-quality-eval
        category: invented_content
        status: fixed
        wrong: '"단순한 테스트 케이스 통과뿐만 아니라 코드 품질, 효율성, 보안성까지 종합적으로 평가"'
        right: "Coding/SWE rewards come from (human-written or synthetic) unit tests run in a Kubernetes sandbox (10,000+ concurrent instances)."
        check: "Coding rewards are unit-test based; no claim of grading code quality, efficiency or security."
        source: "#119 (92f57ad)"
      - id: invented-safety-monitoring
        category: invented_content
        status: fixed
        wrong: '"다층적 안전성 검증 시스템 ... 실시간으로 모니터링"'
        right: "Safety uses human-curated seed prompts and an attack/target/judge prompt-evolution pipeline with task-specific rubrics (binary success/failure)."
        check: "Safety section describes the attack-target-judge pipeline; no real-time monitoring claim."
        source: "#119 (92f57ad)"
      - id: invented-self-refine-loop
        category: invented_content
        status: fixed
        wrong: '"K2는 먼저 자신의 응답을 생성하고, 이를 ... 자체 평가합니다. 그 다음 ... 응답을 개선하고, 개선된 응답을 다시 평가하는 반복적 과정"'
        right: "The K2 actor generates responses and the K2 critic ranks them by pairwise comparison against core, prescriptive and human-annotated rubrics; the critic is refined with verifiable on-policy signals."
        check: "Self-critique is described as pairwise ranking by a critic, not an iterative generate-critique-revise loop."
        source: "#119 (92f57ad)"
      - id: invented-human-rubric-content
        category: invented_content
        status: fixed
        wrong: '"인간 주석 루브릭은 ... 창의성, 공감능력, 문화적 민감성 등"'
        right: "Human-annotated rubrics are crafted by the data team for specific instructional contexts."
        check: "Human-annotated rubrics are not described as covering creativity/empathy/cultural sensitivity."
        source: "#119 (92f57ad)"
      - id: rubric-limitation-garbled
        category: wording
        status: fixed
        wrong: '"모호한 상황에서 자기 자격 부여를 피하고 명확성을 선호하는 경향으로 인해 ... 과도한 확신을 보일 수 있는 잠재적 편향"'
        right: "Prescriptive rules forbid self-qualification, disclaimers and hedging, so the model may overstate certainty where epistemic humility fits (Appendix F)."
        check: "Limitation says prescriptive rules ban hedging/disclaimers, causing overconfidence in ambiguous cases."
        source: "#119 (92f57ad)"
      - id: invented-infra-mechanisms
        category: invented_content
        status: fixed
        wrong: '"점진적 로딩", "계층적 브로드캐스트 알고리즘", "실시간 모니터링과 디버깅 기능" in the duplicated RL infra section'
        right: "Paper: checkpoint engine with pipelined per-parameter transfer and cluster-wide broadcast (full update < 30 s); selective checkpoint reads; partial rollout; Gym-like interface."
        check: "RL infra section has no progressive loading, hierarchical broadcast algorithm or real-time debugging claims."
        source: "#119 (92f57ad)"
      - id: missing-description
        category: metadata
        status: fixed
        wrong: "front matter had no description:"
        right: "Plain-text description: 32B active / 1T total MoE, MuonClip, 15.5T tokens without loss spikes, SWE-Bench Verified 65.8."
        check: "Front matter has a plain-text description starting with 'Kimi K2' using only TL;DR/abstract numbers."
        source: "#88 (40562dc)"
      - id: arxiv-https
        category: citation_link
        status: fixed
        wrong: "http://arxiv.org/pdf/2507.20534v1"
        right: "https://arxiv.org/pdf/2507.20534v1"
        check: "All arXiv links use https."
        source: "#89 (8298b7b)"

  review-zep:
    input: "arXiv 2501.13956"
    kind: review
    post: _posts/2026-06-07-zep-a-temporal-knowledge-graph-architecture-for-agent-memory.md
    sources: ["#86 (7d4251a)", "#88 (40562dc)", "#89 (8298b7b)"]
    notes: >-
      #86 converted about 40 inline formulas; one entry covers them. 534de14
      (#83) also unescaped underscores in display math and renamed tags; not
      listed.
    fixes:
      - id: inline-math-delimiters
        category: markup
        status: fixed
        wrong: '\\(\mathcal{N}\\), \\(t_{\text{ref}}\\), \\(\varphi_{\text{bfs}}\\) ...'
        right: '$$\mathcal{N}$$ (the blog uses $$...$$ for inline and display math)'
        check: 'No \\( \\) or \\[ \\] math delimiters; all math uses $$...$$.'
        source: "#86 (7d4251a)"
      - id: longmemeval-tldr-relative
        category: number_unit
        status: fixed
        wrong: '"정확도를 15.2%포인트, ... 18.5%포인트 향상" (TL;DR)'
        right: "Relative gains: 15.2% (gpt-4o-mini) and 18.5% (gpt-4o) over the full-context baseline."
        check: "TL;DR gives LongMemEval gains as relative % (15.2%, 18.5%), not percentage points."
        source: "#88 (40562dc)"
      - id: longmemeval-results-relative
        category: number_unit
        status: fixed
        wrong: '"베이스라인 대비 정확도가 15.2%포인트 ... 18.5%포인트 향상" (results section 4.3.2)'
        right: "15.2% (55.4% to 63.8%) with gpt-4o-mini; 18.5% (60.2% to 71.2%) with gpt-4o."
        check: "Results section states the absolute accuracies 55.4->63.8 and 60.2->71.2 alongside relative gains; no '%포인트'."
        source: "#88 (40562dc)"
      - id: longmemeval-baseline-misattributed
        category: misattribution
        status: fixed
        wrong: '"gpt-4o-mini 대비 정확도를 15.2%포인트, gpt-4o 대비 18.5%포인트"'
        right: "Gains are measured with gpt-4o-mini / gpt-4o as the answering model, against the full-context baseline using the same model."
        check: "gpt-4o-mini and gpt-4o are named as the models used, not as the baselines Zep beats."
        source: "#88 (40562dc)"
      - id: longmemeval-185-arithmetic
        category: number_scope
        status: fixed
        wrong: '"gpt-4o에서는 18.5%(60.2%에서 71.2%) 향상"'
        right: "60.2 -> 71.2 is about an 18% (18.3%) relative gain; 18.5% is the figure stated in the paper text."
        check: "If 18.5% is paired with 60.2->71.2, it is marked as the paper's stated figure (computed ratio is ~18.3%)."
        source: "#89 (8298b7b)"
      - id: missing-description
        category: metadata
        status: fixed
        wrong: "front matter had no description:"
        right: "Plain-text description: Graphiti temporal KG; DMR 94.8% vs MemGPT 93.4%; LongMemEval latency about 90% lower."
        check: "Front matter has a plain-text description starting with 'Zep' using only TL;DR/abstract numbers."
        source: "#88 (40562dc)"

