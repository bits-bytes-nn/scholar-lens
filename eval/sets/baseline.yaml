# Frozen evaluation set (docs/redesign.md, section 7; ADR 0002). Inputs only;
# the human-fix checklist per item is human_fixes.yaml. Survey items run from
# fixed plan files so paper selection does not vary between runs.
#
# split: "dev" items are the ones prompts and checks were tuned on (their
# PRs and judge findings shaped the rules); "confirm" items were never
# generated before they joined the set. A change of a default is decided on
# confirm items only (eval/JUDGE.md).
items:
  review-dpo: {kind: review, source: "2305.18290", split: dev}
  review-kimi: {kind: review, source: "2507.20534", split: dev}
  review-zep: {kind: review, source: "2501.13956", split: dev}
  summary-toolorchestra: {kind: summarize, source: "2511.21689", split: dev}
  summary-lora: {kind: summarize, source: "2106.09685", split: dev}
  guide-strands:
    kind: guide
    split: dev
    urls:
      - https://strandsagents.com/docs/user-guide/sdk/agents/agent-loop/
      - https://strandsagents.com/docs/user-guide/sdk/agents/hooks/
  guide-rayserve:
    kind: guide
    split: dev
    urls: [https://docs.ray.io/en/latest/serve/getting_started.html]
  guide-vllm:
    kind: guide
    split: dev
    urls: [https://docs.vllm.ai/en/latest/getting_started/quickstart.html]
    reference_urls:
      - https://arxiv.org/abs/2309.06180
      - https://blog.vllm.ai/2023/06/20/vllm.html
  survey-security:
    kind: survey_write
    split: dev
    plan: eval/sets/plans/survey-security.json
  survey-rlhf:
    kind: survey_write
    split: dev
    plan: eval/sets/plans/survey-rlhf.json
  # Held out (2026-11-12): never generated here before joining the set.
  review-mamba: {kind: review, source: "2312.00752", split: confirm}
  review-flashattention2: {kind: review, source: "2307.08691", split: confirm}
  review-kan: {kind: review, source: "2404.19756", split: confirm}
